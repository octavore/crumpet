name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-minimum-xcode:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app
      - name: Build
        run: swift build
      - name: Test
        run: swift test --skip PerformanceTests

  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Build
        run: swift build
      - name: Test
        run: swift test --skip PerformanceTests

  test-latest-xcode:
    runs-on: xcode-27
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: swift build
      - name: Test
        run: swift test --skip PerformanceTests
